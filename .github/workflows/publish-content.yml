name: Publish content release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example content-v0.1.0
        required: true
        type: string
      prerelease:
        description: Publish without replacing the stable latest catalogue
        required: true
      default: false
      type: boolean
  push:
    tags:
      - 'content-v*'

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

permissions:
  contents: write

concurrency:
  group: content-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the content repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install locked dependencies
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze publishing tools
        run: dart analyze

      - name: Validate source content
        run: dart run tool/validate_content.dart --release

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^content-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build release assets
        run: dart run tool/build_release.dart --tag "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            release create "$RELEASE_TAG"
            "dist/$RELEASE_TAG/"*
            --target "$GITHUB_SHA"
            --title "Contenu $RELEASE_TAG"
            --generate-notes
            --fail-on-no-commits
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi
          gh "${release_args[@]}"
